<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>ルート判断マップ</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a0d12'/><circle cx='50' cy='50' r='36' fill='%2306C167'/><text x='50' y='60' font-size='34' font-weight='900' fill='%23000' text-anchor='middle'>U</text></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/route-judge.css?v=20260930_rj5">
</head>
<body>
  <div class="rj-app">
    <header class="rj-header">
      <a class="rj-back" href="index.html" title="UBER LOGへ戻る">← UBER LOG</a>
      <h1 class="rj-title">🧭 ルート判断</h1>
      <a class="rj-link" href="pickup-map.html" title="店舗の配達マップへ">🗺️ 店舗</a>
    </header>

    <div class="rj-modebar" role="toolbar" aria-label="地点の設定">
      <button type="button" class="rj-mode rj-mode-pick" data-mode="pick" aria-pressed="false"><span class="rj-dot pick">P</span>PICK</button>
      <button type="button" class="rj-mode rj-mode-drop" data-mode="drop" aria-pressed="false"><span class="rj-dot drop">D</span>DROP</button>
      <button type="button" class="rj-tool" id="rj-store-toggle" aria-expanded="false" aria-label="店舗からPICKを選ぶ">🏪<span class="t"> 店舗</span></button>
      <button type="button" class="rj-tool" id="rj-clear" aria-label="PICK・DROPをクリア">↺<span class="t"> クリア</span></button>
    </div>
    <div class="rj-hint" id="rj-hint" aria-live="polite"></div>
    <div class="rj-store" id="rj-store" hidden>
      <input id="rj-store-input" class="rj-input" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
             placeholder="PICKにする店舗（例: 九条・マック）" aria-label="PICKにする店舗を検索">
      <ul id="rj-store-list" class="rj-store-list" role="listbox"></ul>
    </div>

    <main class="rj-map-wrap" id="rj-map-wrap">
      <div id="rj-map" class="rj-map" aria-label="ルート判断マップ"></div>
      <div id="rj-verdict" class="rj-verdict" aria-live="polite"></div>
      <div id="rj-toast" class="rj-toast" role="status" aria-live="polite" hidden></div>
    </main>

    <section class="rj-panel" id="rj-panel">
      <div id="rj-legs"></div>
      <div class="rj-card">
        <h2>安治川の横断ポイント</h2>
        <ul class="rj-crossings" id="rj-crossings"></ul>
      </div>
      <div class="rj-card rj-legend">
        <h2>地図の見方</h2>
        <ul>
          <li><span class="rj-here"></span>現在地（◎で取得・常時追跡なし）</li>
          <li><span class="rj-dot pick">P</span>PICK（ピックアップ）</li>
          <li><span class="rj-dot drop">D</span>DROP（配達先）</li>
          <li><span class="rj-sw river"></span>安治川（北岸＝此花・福島／南岸＝西区・港区）</li>
          <li><span class="rj-sw tunnel"></span>安治川トンネル（入口＝エレベーター）</li>
          <li><span class="rj-sw bridge"></span>安治川大橋（<b class="rj-warn">⚠ 自転車押し歩きあり</b>・赤＝階段）</li>
          <li><span class="rj-sw ref"></span>天保山渡船・上流回り（参考）</li>
        </ul>
        <p class="rj-note">距離はすべて直線の目安です（道路の経路計算ではありません）。PICK・DROPはドラッグで動かせます。</p>
      </div>
    </section>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="js/map-locate.js?v=20260930_rj5"></script>
  <script src="js/route-judge-core.js?v=20260930_rj5"></script>
  <script src="data/uber_route_geo.js?v=20260930_rj5"></script>
  <script src="data/uber_pickup_stores.js?v=20261006_rj6"></script>
  <script src="js/route-judge.js?v=20260930_rj5"></script>
</body>
</html>
